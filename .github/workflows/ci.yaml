name: 'CI Dashboard-Generator'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-frontend:
    name: 'Frontend (React + Vite)'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'Checkout do código'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 'Instalar dependências'
        working-directory: frontend
        run: npm ci

      - name: 'Type check'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 'Testes'
        working-directory: frontend
        run: npx vitest run --reporter=verbose

      - name: 'Build de produção'
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_USE_REAL_API: ${{ secrets.VITE_USE_REAL_API }}
        run: npm run build

      - name: 'Upload de artefato de build'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  ci-backend:
    name: 'Backend (Node.js)'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'Checkout do código'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 'Instalar dependências'
        working-directory: backend
        run: npm ci

      - name: 'Testes'
        working-directory: backend
        env:
          JWT_SECRET: test_secret_for_ci_only_32chars!!
          NODE_ENV: test
        run: npm test