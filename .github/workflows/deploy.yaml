name: 'CD - Deploy no Render'

on:
  workflow_run:
    workflows: ['CI Dashboard-Generator']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: ${{github.event.workflow_run.conclusion == 'success'}}

    permissions:
      contents: read

    steps:
      - name: 'Disparar deploy do frontend no Render'
        run: 'curl -X POST "${{secrets.RENDER_DEPLOY_HOOK_FRONTEND}}"'

      - name: 'Disparar deploy do backend no Render'
        run: 'curl -X POST "${{secrets.RENDER_DEPLOY_HOOK_BACKEND}}"'